[project]
name = "architecture-backend"
version = "0.1.0"
description = "Backend for the AWS architecture diagram editor (schema, Describe normalization, HTML export)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
    "boto3>=1.43.97",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "httpx2>=2.13.0",
    "anyio>=4.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Ambiguous-Unicode detection is off: diagram names and sample data may
# legitimately contain full-width punctuation.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Service definition tables read better one service per line.
"../scripts/make_placeholder_icons.py" = ["E501"]
# Test fixtures read better with a dict or list as a class attribute.
"tests/*" = ["RUF012", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
