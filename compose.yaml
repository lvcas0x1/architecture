services:
  architecture:
    image: localhost/architecture:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${ARCH_BIND_ADDRESS:-127.0.0.1}:${ARCH_PORT:-8000}:8000"
    environment:
      ARCH_WORKSPACE: /data/workspace
      ARCH_ACCOUNTS: /config/accounts.yaml
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      AWS_PROFILE:
    volumes:
      - workspace:/data/workspace
      - ./config:/config:ro,Z
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  workspace:
